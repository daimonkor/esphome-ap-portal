name: CI
on:
  push:
  pull_request:
env:
  # ap_portal leans on ESPHome Wi-Fi internals; it is tested against exactly this version.
  ESPHOME_VERSION: "2026.11.0"
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Core tests
        run: make -C tests/host
      - name: Core tests (sanitizers)
        run: make -C tests/host asan
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Page scripts (jsdom)
        run: cd tests/js && npm install --no-audit --no-fund && npm test
  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "esphome==${ESPHOME_VERSION}" pytest
      - name: Config tests (examples + good / bad configs)
        run: python3 -m pytest -q tests/config
  esphome-compile:
    runs-on: ubuntu-latest
    needs: esphome-config
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Compile examples
        run: |
          cd examples
          for f in hello_world.yaml motion_sensor.yaml hivescale.yaml deye.yaml; do esphome compile "$f"; done
      - name: Compile hello_world on Arduino
        run: |
          cd examples
          sed 's/type: esp-idf/type: arduino/; s/name: ap-portal-hello/name: ap-portal-hello-arduino/' hello_world.yaml > hello_world_arduino.yaml
          grep -q 'type: arduino' hello_world_arduino.yaml
          esphome compile hello_world_arduino.yaml
