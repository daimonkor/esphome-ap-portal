name: CI
on:
  push:
  pull_request:
env:
  # ap_portal leans on ESPHome Wi-Fi internals; it is tested against exactly this version.
  ESPHOME_VERSION: "2026.10.2"
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Core tests
        run: make -C tests/host
      - name: Core tests (sanitizers)
        run: make -C tests/host asan
  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install "esphome==${ESPHOME_VERSION}" pytest
      - name: Config tests (examples + good / bad configs)
        run: python3 -m pytest -q tests/config
  esphome-compile:
    runs-on: ubuntu-latest
    needs: esphome-config
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Compile examples
        run: |
          cd examples
          for f in hello_world.yaml motion_sensor.yaml hivescale.yaml deye.yaml; do esphome compile "$f"; done
